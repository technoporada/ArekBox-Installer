<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArekBox — Wizualizator Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #4a5568 0%, #2d3748 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo::before {
            content: "♪";
            color: white;
            font-size: 1.5rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .visualizer-container {
            width: 100%;
            max-width: 1400px;
            height: 400px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            background: rgba(30, 30, 30, 0.95);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-section {
            margin-bottom: 1.5rem;
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #a0a0a0;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #5a6578 0%, #3d4758 100%);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #2d3748;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #3d4758;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #a0a0a0;
            min-width: 100px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            min-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a5568 0%, #667eea 100%);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .volume-slider {
            width: 100px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #1a1a1a;
            border-radius: 3px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #4a5568;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #4a5568;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .visualization-modes {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid #2d3748;
            background: #1a1a1a;
            color: #a0a0a0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            border-color: #4a5568;
        }

        .mode-btn:hover:not(.active) {
            border-color: #4a5568;
            color: #e0e0e0;
        }

        .theme-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-btn.active {
            border-color: #667eea;
            transform: scale(1.1);
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-gradient-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-gradient-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .theme-gradient-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .theme-gradient-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .theme-gradient-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .theme-gradient-6 { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }

        .track-info {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .track-name {
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 0.3rem;
        }

        .track-artist {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #2d3748;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid #43e97b;
        }

        .notification.error {
            border-left: 4px solid #f5576c;
        }

        @media (max-width: 768px) {
            .header-content {
                justify-content: center;
                text-align: center;
            }

            .visualizer-container {
                height: 300px;
            }

            .controls {
                padding: 1.5rem;
            }

            .playback-controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>
                <div class="logo"></div>
                ArekBox — Wizualizator Audio
            </h1>
        </div>
    </header>

    <main>
        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="controls">
            <div class="control-section">
                <div class="section-title">Źródło dźwięku</div>
                <div class="input-section">
                    <div class="file-input-wrapper">
                        <input type="file" id="audioFile" accept="audio/*">
                        <label for="audioFile" class="file-input-label">
                            📁 Wybierz plik audio
                        </label>
                    </div>
                    <button class="btn btn-primary" id="micBtn">
                        🎤 Mikrofon
                    </button>
                </div>
            </div>

            <div class="track-info" id="trackInfo" style="display: none;">
                <div class="track-name" id="trackName">Brak utworu</div>
                <div class="track-artist" id="trackArtist">Wybierz plik audio</div>
            </div>

            <div class="control-section">
                <div class="section-title">Odtwarzanie</div>
                <div class="playback-controls">
                    <button class="play-btn" id="playBtn" disabled>
                        ▶
                    </button>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                        <span id="volumeValue">70%</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">Tryb wizualizacji</div>
                <div class="visualization-modes">
                    <button class="mode-btn active" data-mode="bars">Słupki</button>
                    <button class="mode-btn" data-mode="wave">Fala</button>
                    <button class="mode-btn" data-mode="circular">Kołowy</button>
                    <button class="mode-btn" data-mode="mirror">Lustrzany</button>
                    <button class="mode-btn" data-mode="particles">Cząsteczki</button>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">Motyw kolorystyczny</div>
                <div class="theme-selector">
                    <button class="theme-btn theme-gradient-1 active" data-theme="1"></button>
                    <button class="theme-btn theme-gradient-2" data-theme="2"></button>
                    <button class="theme-btn theme-gradient-3" data-theme="3"></button>
                    <button class="theme-btn theme-gradient-4" data-theme="4"></button>
                    <button class="theme-btn theme-gradient-5" data-theme="5"></button>
                    <button class="theme-btn theme-gradient-6" data-theme="6"></button>
                </div>
            </div>
        </div>
    </main>

    <div class="notification" id="notification"></div>

    <script>
        class AudioVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.dataArray = null;
                this.animationId = null;
                this.audio = new Audio();
                this.isPlaying = false;
                this.mode = 'bars';
                this.theme = 1;
                this.particles = [];
                this.isMicrophoneActive = false;

                this.themes = {
                    1: ['#667eea', '#764ba2'],
                    2: ['#f093fb', '#f5576c'],
                    3: ['#4facfe', '#00f2fe'],
                    4: ['#43e97b', '#38f9d7'],
                    5: ['#fa709a', '#fee140'],
                    6: ['#30cfd0', '#330867']
                };

                this.init();
            }

            init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.setupAudio();
                window.addEventListener('resize', () => this.setupCanvas());
            }

            setupCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            setupAudio() {
                this.audio.addEventListener('loadedmetadata', () => {
                    this.updateTrackInfo();
                    document.getElementById('playBtn').disabled = false;
                });

                this.audio.addEventListener('timeupdate', () => {
                    this.updateProgress();
                });

                this.audio.addEventListener('ended', () => {
                    this.isPlaying = false;
                    document.getElementById('playBtn').innerHTML = '▶';
                });
            }

            setupEventListeners() {
                document.getElementById('audioFile').addEventListener('change', (e) => {
                    this.loadAudioFile(e.target.files[0]);
                });

                document.getElementById('micBtn').addEventListener('click', () => {
                    this.toggleMicrophone();
                });

                document.getElementById('playBtn').addEventListener('click', () => {
                    this.togglePlayback();
                });

                document.getElementById('progressBar').addEventListener('click', (e) => {
                    if (this.audio.duration) {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const percent = (e.clientX - rect.left) / rect.width;
                        this.audio.currentTime = percent * this.audio.duration;
                    }
                });

                document.getElementById('volumeSlider').addEventListener('input', (e) => {
                    const volume = e.target.value / 100;
                    this.audio.volume = volume;
                    document.getElementById('volumeValue').textContent = `${e.target.value}%`;
                });

                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.mode = btn.dataset.mode;
                        if (this.mode === 'particles') {
                            this.initParticles();
                        }
                    });
                });

                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.theme = parseInt(btn.dataset.theme);
                    });
                });
            }

            async loadAudioFile(file) {
                if (!file) return;

                const url = URL.createObjectURL(file);
                this.audio.src = url;

                if (this.isMicrophoneActive) {
                    this.stopMicrophone();
                }

                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                if (this.source) {
                    this.source.disconnect();
                }

                this.source = this.audioContext.createMediaElementSource(this.audio);
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 256;

                const bufferLength = this.analyser.frequencyBinCount;
                this.dataArray = new Uint8Array(bufferLength);

                this.source.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);

                document.getElementById('trackName').textContent = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('trackArtist').textContent = `Rozmiar: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
                document.getElementById('trackInfo').style.display = 'block';

                this.showNotification('Plik audio wczytany!', 'success');
            }

            async toggleMicrophone() {
                if (this.isMicrophoneActive) {
                    this.stopMicrophone();
                } else {
                    await this.startMicrophone();
                }
            }

            async startMicrophone() {
                try {
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    if (this.source) {
                        this.source.disconnect();
                    }

                    this.source = this.audioContext.createMediaStreamSource(stream);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;

                    const bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(bufferLength);

                    this.source.connect(this.analyser);

                    this.isMicrophoneActive = true;
                    this.microphoneStream = stream;

                    document.getElementById('micBtn').textContent = '🔴 Zatrzymaj mikrofon';
                    document.getElementById('micBtn').classList.add('btn-secondary');
                    document.getElementById('micBtn').classList.remove('btn-primary');
                    document.getElementById('trackInfo').style.display = 'block';
                    document.getElementById('trackName').textContent = 'Wejście mikrofonu';
                    document.getElementById('trackArtist').textContent = 'Dźwięk na żywo z mikrofonu';

                    this.showNotification('Mikrofon aktywowany!', 'success');
                    this.startVisualization();
                } catch (error) {
                    this.showNotification('Błąd mikrofonu: ' + error.message, 'error');
                }
            }

            stopMicrophone() {
                if (this.microphoneStream) {
                    this.microphoneStream.getTracks().forEach(track => track.stop());
                    this.microphoneStream = null;
                }

                this.isMicrophoneActive = false;
                document.getElementById('micBtn').textContent = '🎤 Mikrofon';
                document.getElementById('micBtn').classList.remove('btn-secondary');
                document.getElementById('micBtn').classList.add('btn-primary');

                this.showNotification('Mikrofon wyłączony', 'success');
            }

            togglePlayback() {
                if (this.isPlaying) {
                    this.audio.pause();
                    document.getElementById('playBtn').innerHTML = '▶';
                    this.isPlaying = false;
                } else {
                    this.audio.play();
                    document.getElementById('playBtn').innerHTML = '⏸';
                    this.isPlaying = true;
                    this.startVisualization();
                }
            }

            updateProgress() {
                const current = this.audio.currentTime;
                const duration = this.audio.duration || 0;
                const percent = (current / duration) * 100;

                document.getElementById('progressFill').style.width = `${percent}%`;
                document.getElementById('timeDisplay').textContent =
                    `${this.formatTime(current)} / ${this.formatTime(duration)}`;
            }

            updateTrackInfo() {
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            startVisualization() {
                if (!this.analyser) return;

                const animate = () => {
                    this.animationId = requestAnimationFrame(animate);
                    this.analyser.getByteFrequencyData(this.dataArray);

                    const width = this.canvas.width / window.devicePixelRatio;
                    const height = this.canvas.height / window.devicePixelRatio;

                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                    this.ctx.fillRect(0, 0, width, height);

                    switch(this.mode) {
                        case 'bars':
                            this.drawBars(width, height);
                            break;
                        case 'wave':
                            this.drawWave(width, height);
                            break;
                        case 'circular':
                            this.drawCircular(width, height);
                            break;
                        case 'mirror':
                            this.drawMirror(width, height);
                            break;
                        case 'particles':
                            this.drawParticles(width, height);
                            break;
                    }
                };

                animate();
            }

            drawBars(width, height) {
                const barWidth = width / this.dataArray.length * 2.5;
                let x = 0;

                const gradient = this.ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, this.themes[this.theme][0]);
                gradient.addColorStop(1, this.themes[this.theme][1]);

                for (let i = 0; i < this.dataArray.length; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height * 0.8;

                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, height - barHeight, barWidth - 2, barHeight);

                    this.ctx.globalAlpha = 0.3;
                    this.ctx.fillRect(x, height - barHeight - 5, barWidth - 2, -barHeight * 0.3);
                    this.ctx.globalAlpha = 1;

                    x += barWidth;
                }
            }

            drawWave(width, height) {
                this.ctx.lineWidth = 3;
                const gradient = this.ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, this.themes[this.theme][0]);
                gradient.addColorStop(1, this.themes[this.theme][1]);
                this.ctx.strokeStyle = gradient;

                this.ctx.beginPath();
                const sliceWidth = width / this.dataArray.length;
                let x = 0;

                for (let i = 0; i < this.dataArray.length; i++) {
                    const v = this.dataArray[i] / 255;
                    const y = height / 2 + (v - 0.5) * height * 0.8;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                this.ctx.stroke();
            }

            drawCircular(width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                const radius = Math.min(width, height) * 0.3;

                for (let i = 0; i < this.dataArray.length; i++) {
                    const angle = (i / this.dataArray.length) * Math.PI * 2;
                    const barHeight = (this.dataArray[i] / 255) * radius;

                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                    const y2 = centerY + Math.sin(angle) * (radius + barHeight);

                    const gradient = this.ctx.createLinearGradient(x1, y1, x2, y2);
                    gradient.addColorStop(0, this.themes[this.theme][0]);
                    gradient.addColorStop(1, this.themes[this.theme][1]);

                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x2, y2);
                    this.ctx.stroke();
                }
            }

            drawMirror(width, height) {
                const barWidth = width / this.dataArray.length * 2.5;
                let x = 0;
                const middleY = height / 2;

                const gradient1 = this.ctx.createLinearGradient(0, middleY, 0, 0);
                gradient1.addColorStop(0, this.themes[this.theme][0]);
                gradient1.addColorStop(1, this.themes[this.theme][1]);

                const gradient2 = this.ctx.createLinearGradient(0, middleY, 0, height);
                gradient2.addColorStop(0, this.themes[this.theme][1]);
                gradient2.addColorStop(1, this.themes[this.theme][0]);

                for (let i = 0; i < this.dataArray.length; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height * 0.4;

                    this.ctx.fillStyle = gradient1;
                    this.ctx.fillRect(x, middleY - barHeight, barWidth - 2, barHeight);

                    this.ctx.fillStyle = gradient2;
                    this.ctx.fillRect(x, middleY, barWidth - 2, barHeight);

                    x += barWidth;
                }
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        color: Math.random() > 0.5 ? this.themes[this.theme][0] : this.themes[this.theme][1]
                    });
                }
            }

            drawParticles(width, height) {
                if (this.particles.length === 0) {
                    this.initParticles();
                }

                const average = this.dataArray.reduce((a, b) => a + b) / this.dataArray.length;
                const intensity = average / 255;

                this.particles.forEach(particle => {
                    particle.x += particle.vx * (1 + intensity * 3);
                    particle.y += particle.vy * (1 + intensity * 3);

                    if (particle.x < 0 || particle.x > width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > height) particle.vy *= -1;

                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size * (1 + intensity), 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.globalAlpha = 0.6 + intensity * 0.4;
                    this.ctx.fill();
                });

                this.ctx.globalAlpha = 1;
            }

            showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type} show`;

                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        const visualizer = new AudioVisualizer();
    </script>
